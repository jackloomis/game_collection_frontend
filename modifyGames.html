<html>
    <head>
        <title>Video Game Collection Homepage</title>
        <link href="./stylesheets/gametheme.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>

    <body>

        <div class="game-navbar">
            <a href="index.html">Home</a>
            <a href="addGames.html">Add Games</a>
            <a href="modifyGames.html">Modify Games</a>
        </div>

        <div class="container">
            <div class="form-container">
                <h2>Modify Games</h2>
                <form class="form">
                    <label for="id">Game ID:</label>
                    <input type="number" id="id" name="id" placeholder="Enter Game ID" required>

                    <label for="title">Title:</label>
                    <input type="text" id="title" name="title" placeholder="Enter Title" required>

                    <label for="genre">Genre:</label>
                    <input type="text" id="genre" name="genre" placeholder="Enter Genre">

                    <label for="system_id">System ID:</label>
                    <select id="system_id" name="system_id" required>
                        <option value="">Select System</option>
                        <option value="1">PC</option>
                        <option value="2">Xbox Series X/S</option>
                        <option value="3">PlayStation 5</option>
                        <option value="4">Nintendo Switch 2</option>
                        <option value="5">Xbox One</option>
                        <option value="6">PlayStation 4</option>
                        <option value="7">Nintendo Switch</option>
                        <option value="8">Xbox 360</option>
                        <option value="9">PlayStation 3</option>
                        <option value="10">Nintendo Wii</option>
                        <option value="11">Nintendo 3DS</option>
                        <option value="12">Nintendo DS</option>
                    </select>

                    <label for="status_id">Status ID:</label>
                    <select id="status_id" name="status_id" required>
                        <option value="">Select Played Status</option>
                        <option value="1">Unplayed</option>
                        <option value="2">Currently Playing</option>
                        <option value="3">Completed</option>
                        <option value="4">Not Playing</option>
                    </select>

                    <label for="rating">Rating (optional):</label>
                    <select id="rating" name="rating">
                        <option value="">Select Rating</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                        <option value="6">6</option>
                        <option value="7">7</option>
                        <option value="8">8</option>
                        <option value="9">9</option>
                        <option value="10">10</option>
                    </select>


                    <div class="button-container">
                        <button type="submit" class="submit-btn">Submit</button>
                    </div>
                </form>
            </div>
        </div>

        <script src="//ajax.googleapis.com/ajax/libs/jquery/1.11.1/jquery.min.js"></script>
        <script src="//netdna.bootstrapcdn.com/bootstrap/3.2.0/js/bootstrap.min.js"></script>
        <script src="/js/jquery.toaster.js"></script>
        <script src="./js/putGames.js"></script>

    </body>
</html>
